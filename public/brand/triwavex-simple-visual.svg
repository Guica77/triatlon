<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">TriWaveX simple visual identity concept</title>
  <desc id="desc">A dark graphite hero layout with a three-arc logo and a simplified triathlon training dashboard shown inside a mobile phone.</desc>
  <defs>
    <linearGradient id="phoneGlow" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1A2630"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="#0B1117"/>
  <circle cx="995" cy="92" r="215" fill="#17242B"/>
  <circle cx="1087" cy="704" r="185" fill="#111D24"/>

  <g transform="translate(92 92)">
    <rect width="84" height="84" rx="24" fill="#B7F36B"/>
    <path d="M22 54 C30 28 48 17 63 24" fill="none" stroke="#0B1117" stroke-width="7" stroke-linecap="round"/>
    <path d="M22 65 C35 36 55 29 69 37" fill="none" stroke="#0B1117" stroke-width="7" stroke-linecap="round"/>
    <path d="M22 76 C40 49 59 44 74 52" fill="none" stroke="#0B1117" stroke-width="7" stroke-linecap="round"/>
  </g>

  <text x="92" y="250" fill="#F4F7F7" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="750" letter-spacing="5">TRIWAVEX</text>
  <text x="96" y="302" fill="#B7F36B" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2">TRAIN WITH CLARITY.</text>
  <text x="96" y="350" fill="#94A3A8" font-family="Inter, Arial, sans-serif" font-size="22">Swim, bike, and run with one calm view</text>
  <text x="96" y="382" fill="#94A3A8" font-family="Inter, Arial, sans-serif" font-size="22">of what matters today.</text>

  <g transform="translate(768 76)">
    <rect x="0" y="0" width="300" height="648" rx="42" fill="#060A0E" stroke="#31404A" stroke-width="3"/>
    <rect x="14" y="14" width="272" height="620" rx="32" fill="url(#phoneGlow)"/>
    <rect x="100" y="29" width="100" height="18" rx="9" fill="#060A0E"/>
    <text x="34" y="88" fill="#94A3A8" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">TUESDAY · 7 SEP</text>
    <text x="34" y="124" fill="#F4F7F7" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">Today’s focus</text>
    <rect x="34" y="148" width="232" height="142" rx="22" fill="#17242B"/>
    <circle cx="84" cy="205" r="36" fill="none" stroke="#304049" stroke-width="10"/>
    <path d="M84 169 A36 36 0 1 1 58 230" fill="none" stroke="#B7F36B" stroke-width="10" stroke-linecap="round"/>
    <text x="73" y="212" fill="#F4F7F7" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="750">68%</text>
    <text x="134" y="190" fill="#B7F36B" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">RUN</text>
    <text x="134" y="220" fill="#F4F7F7" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">42 min</text>
    <text x="134" y="247" fill="#94A3A8" font-family="Inter, Arial, sans-serif" font-size="13">steady aerobic</text>
    <text x="34" y="336" fill="#94A3A8" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">WEEKLY LOAD</text>
    <rect x="34" y="354" width="232" height="8" rx="4" fill="#26353D"/>
    <rect x="34" y="354" width="158" height="8" rx="4" fill="#79C7FF"/>
    <text x="34" y="400" fill="#F4F7F7" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="750">2.8</text>
    <text x="108" y="400" fill="#94A3A8" font-family="Inter, Arial, sans-serif" font-size="15">of 4.0 load</text>
    <rect x="34" y="442" width="232" height="1" fill="#304049"/>
    <text x="34" y="480" fill="#F4F7F7" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Next up</text>
    <text x="34" y="510" fill="#94A3A8" font-family="Inter, Arial, sans-serif" font-size="14">Recovery · 8 min</text>
    <circle cx="246" cy="501" r="17" fill="#B7F36B"/>
    <path d="M240 501 l5 5 9 -11" fill="none" stroke="#0B1117" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="34" y="552" width="232" height="48" rx="16" fill="#B7F36B"/>
    <text x="107" y="582" fill="#0B1117" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">START RUN</text>
  </g>

  <g transform="translate(96 635)">
    <rect width="10" height="10" rx="5" fill="#B7F36B"/>
    <text x="24" y="11" fill="#94A3A8" font-family="Inter, Arial, sans-serif" font-size="14">Primary accent · progress and action</text>
    <rect x="270" width="10" height="10" rx="5" fill="#79C7FF"/>
    <text x="294" y="11" fill="#94A3A8" font-family="Inter, Arial, sans-serif" font-size="14">Secondary · swim / data</text>
    <rect x="506" width="10" height="10" rx="5" fill="#FF8A74"/>
    <text x="530" y="11" fill="#94A3A8" font-family="Inter, Arial, sans-serif" font-size="14">Secondary · recovery / alert</text>
  </g>
</svg>
